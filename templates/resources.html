<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Resources - StudyTool</title>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <script src="{{ url_for('static', filename='ai_chats.js') }}" defer></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="app">

        <!-- Sidebar Navigation -->
        <aside class="sidebar">

            <div class="logo">
                <div class="logo-mark">✦</div>
                <span>StudyTool</span>
            </div>

            <nav class="navigation">

                <a href="{{ url_for('home') }}" class="nav-link">
                    <span class="nav-icon">▦</span>
                    Dashboard
                </a>

                <a href="{{ url_for('resources') }}" class="nav-link active">
                    <span class="nav-icon">⌕</span>
                    Study Resources
                </a>

                <a href="{{ url_for('noise_songs') }}" class="nav-link">
                    <span class="nav-icon">♫</span>
                    Noise &amp; Songs
                </a>

                <a href="{{ url_for('time_management') }}" class="nav-link">
                    <span class="nav-icon">✓</span>
                    Time Management
                </a>

                <a href="{{ url_for('support') }}" class="nav-link">
                    <span class="nav-icon">♡</span>
                    Student Support
                </a>

                {% include "_ai_nav.html" %}

            </nav>

            <div class="sidebar-bottom">
                <a href="{{ url_for('settings') }}" class="nav-link">
                    <span class="nav-icon">⚙</span>
                    Settings
                </a>

                <a href="{{ url_for('support') }}" class="nav-link">
                    <span class="nav-icon">?</span>
                    Help
                </a>

            </div>

        </aside>


        <!-- Main Workspace -->
        <main class="main-content">

            <!-- Top Header -->
            <header class="topbar">

                <button class="mobile-menu">☰</button>

                <div class="welcome">
                    <div class="welcome-icon">⌕</div>
                    <div>
                        <h1>What do you want to learn?</h1>
                        <p>Find free resources for any subject or topic.</p>
                    </div>
                </div>

            </header>


            <!-- Resources Dashboard Wireframe -->
            <section class="dashboard">

                <!-- Search Input Form -->
                <div class="main-card study-card">

                    <form id="resource-search-form" action="{{ url_for('resources') }}" method="GET">

                        <div class="search-box" style="margin: 0; background: var(--bg, #f4f5f7); border: 1px solid var(--border-color, #e0e0e0); border-radius: 8px; padding: 10px 15px; display: flex; align-items: center; gap: 10px;">
                            <span class="search-icon">🔍</span>
                            <input 
                                type="text" 
                                id="search-input"
                                name="query" 
                                value="{{ query if query else '' }}"
                                placeholder="Search a topic, subject, or assignment..." 
                                style="border:none; background:transparent; width:100%; outline:none; font-size:15px; color:#111111;"
                            >
                        </div>

                    </form>

                </div>


                


                <!-- Your Recent Searches -->
                <div class="section-heading">
                    <h2>Your Recent Searches</h2>
                </div>

                <div id="recent-searches-list" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px;">
                    <!-- Recent search chips will render here -->
                </div>


                

            </section>

        </main>

    </div>


    <!-- Recent Searches Script -->
    <!-- Keep up to five recent topic searches in browser storage and render shortcuts. -->
    <script>
        const DEFAULT_SEARCHES = ["Newton's Laws", "Quadratic Equations", "AP Euro Renaissance"];
        const searchInput = document.getElementById('search-input');
        const searchForm = document.getElementById('resource-search-form');
        const recentSearchesContainer = document.getElementById('recent-searches-list');

        function getRecentSearches() {
            const saved = localStorage.getItem('recent_study_searches');
            // Load saved searches or use starter examples for a first visit.
            if (saved) {
                return JSON.parse(saved);
            }
            return DEFAULT_SEARCHES;
        }

        function saveRecentSearch(query) {
            if (!query.trim()) return;
            // Move this query to the front and cap the saved history at five entries.
            let searches = getRecentSearches();
            searches = searches.filter(item => item.toLowerCase() !== query.toLowerCase());
            searches.unshift(query.trim());
            if (searches.length > 5) {
                searches = searches.slice(0, 5);
            }
            localStorage.setItem('recent_study_searches', JSON.stringify(searches));
        }

        function renderRecentSearches() {
            const searches = getRecentSearches();
            recentSearchesContainer.innerHTML = '';

            searches.forEach(term => {
                const chip = document.createElement('a');
                chip.href = `/resources?query=${encodeURIComponent(term)}`;
                chip.textContent = term;
                chip.className = "recent-search-chip";
                recentSearchesContainer.appendChild(chip);
            });
        }

        searchForm.addEventListener('submit', function() {
            if (searchInput.value.trim()) {
                saveRecentSearch(searchInput.value.trim());
            }
        });

        const currentQuery = "{{ query }}";
        if (currentQuery) {
            saveRecentSearch(currentQuery);
        }

        renderRecentSearches();
    </script>

</body>
</html>

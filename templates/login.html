<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyTool Login</title>
    <!-- Center the sign-in form and define its compact page-specific appearance. -->
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7ff, #eef4ff);
            color: #1f2937;
        }
        .login-card {
            width: min(90vw, 420px);
            background: white;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
            padding: 32px 28px;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 2rem;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #4b5563;
            margin-bottom: 24px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        label {
            font-weight: 600;
            color: #374151;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
        }
        button {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 16px;
        }
        .demo {
            margin-top: 18px;
            text-align: center;
            color: #4b5563;
            font-size: 0.95rem;
        }
        .account-link {
            display: block;
            margin-top: 14px;
            color: #4338ca;
            text-align: center;
            text-decoration: none;
        }
        .account-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <!-- Authentication card for returning users; Flask renders validation errors here. -->
    <div class="login-card">
        <h1>StudyTool</h1>
        <p class="subtitle">Sign in to continue</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
        <!-- Credentials are posted to the login route, which creates the session. -->
            <div>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="admin" required>
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="admin123" required>
            </div>

            <button type="submit">Log In</button>
        </form>

        <a class="account-link" href="{{ url_for('signup', next=request.args.get('next', '')) }}">Create an account</a>
        <p class="demo">Demo credentials: <strong>admin</strong> / <strong>admin123</strong></p>
    </div>
</body>
</html>

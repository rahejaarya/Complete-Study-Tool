<!DOCTYPE html>
<html lang="en">
<head>
    {% include "_favicon.html" %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meridian Login</title>
    <!-- Center the sign-in form with the app's shared neutral and blue visual style. -->
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8f9fa;
            color: #202124;
        }
        .login-card {
            width: min(100%, 440px);
            background: white;
            border: 1px solid #dadce0;
            border-radius: 14px;
            box-shadow: 0 2px 5px rgba(60, 64, 67, 0.10), 0 8px 24px rgba(60, 64, 67, 0.08);
            padding: 38px 36px 30px;
        }
        .login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            color: #3c4043;
            font-size: 17px;
            font-weight: 650;
            letter-spacing: -0.2px;
        }
        .login-brand-mark {
            width: 34px;
            height: 34px;
            position: relative;
            flex: 0 0 34px;
        }
        .login-brand-mark img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 7px;
            font-size: 1.8rem;
            line-height: 1.2;
            text-align: center;
            letter-spacing: -0.6px;
        }
        .login-intro {
            margin: 0 0 28px;
            color: #5f6368;
            font-size: 14px;
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        form > div { display: grid; gap: 7px; }
        label {
            font-size: 14px;
            font-weight: 600;
            color: #3c4043;
        }
        input {
            width: 100%;
            min-height: 48px;
            padding: 11px 13px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            background: #fff;
            color: #202124;
            font: inherit;
            font-size: 15px;
            transition: border-color 140ms ease, box-shadow 140ms ease;
        }
        input:focus {
            border-color: #1a73e8;
            outline: none;
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.16);
        }
        button {
            border: none;
            background: #1a73e8;
            color: white;
            min-height: 48px;
            margin-top: 3px;
            padding: 12px 18px;
            border-radius: 8px;
            font: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(26, 115, 232, 0.22);
            transition: background-color 140ms ease, box-shadow 140ms ease;
        }
        button:hover {
            background: #1765cc;
            box-shadow: 0 2px 5px rgba(26, 115, 232, 0.25);
        }
        button:focus-visible,
        .account-link:focus-visible {
            outline: 2px solid #1a73e8;
            outline-offset: 3px;
        }
        .error {
            background: #fce8e6;
            color: #b3261e;
            border: 1px solid #f1b7b2;
            border-radius: 9px;
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .account-link {
            display: block;
            margin-top: 20px;
            color: #1967d2;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
        }
        .account-link:hover { text-decoration: underline; }
        @media (max-width: 480px) {
            body { padding: 16px; }
            .login-card { padding: 30px 22px 24px; }
        }
    </style>
</head>
<body>
    <!-- Authentication card for returning users; Flask renders validation errors here. -->
    <div class="login-card">
        <div class="login-brand">
            <span class="login-brand-mark" aria-hidden="true">
                <img src="{{ url_for('static', filename='meridian-logo.png') }}" alt="">
            </span>
            <span>Meridian</span>
        </div>
        <h1>Welcome back</h1>
        <p class="login-intro">Sign in to continue to your study space.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
        <!-- Credentials are posted to the login route, which creates the session. -->
            <div>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit">Log In</button>
        </form>

        <a class="account-link" href="{{ url_for('signup', next=request.args.get('next', '')) }}">Create an account</a>
    </div>
</body>
</html>

<div class="ai-nav-section">
    <!-- Shared sidebar links for notes and the AI assistant's saved conversations. -->
    <a href="{{ url_for('notes') }}" class="nav-link{% if request.endpoint == 'notes' %} active{% endif %}"{% if request.endpoint == 'notes' %} aria-current="page"{% endif %}>
        <span class="nav-icon">✎</span>
        Notes
    </a>
    <div class="ai-nav-row{% if request.endpoint == 'ai_help' %} active{% endif %}">
    <!-- The dropdown toggle exposes the saved-chat list alongside the AI entry. -->
        <a href="{{ url_for('ai_help') }}" class="nav-link{% if request.endpoint == 'ai_help' %} active{% endif %}"{% if request.endpoint == 'ai_help' %} aria-current="page"{% endif %}>
            <span class="nav-icon">⟡</span>
            <span>Cypher</span>
        </a>
        <button
            id="ai-chats-toggle"
            class="ai-chats-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="ai-chat-dropdown"
            title="Show chats"
            aria-label="Show saved chats"
        >▾</button>
    </div>
    <div id="ai-chat-dropdown" class="ai-chat-dropdown">
    <!-- The new-chat control is a button on the AI page and a link elsewhere. -->
        <div class="chat-sidebar-header">
            <span>Chats</span>
            {% if request.endpoint == "ai_help" %}
            <button
                id="new-chat-button"
                type="button"
                title="New conversation"
                aria-label="New conversation"
            >+</button>
            {% else %}
            <a
                id="new-chat-button"
                href="{{ url_for('ai_help') }}"
                title="New conversation"
                aria-label="New conversation"
            >+</a>
            {% endif %}
        </div>
        <div class="chat-list"></div>
    </div>
</div>

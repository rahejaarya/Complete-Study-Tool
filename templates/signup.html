<!DOCTYPE html>
<html lang="en">
<head>
    {% include "_favicon.html" %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Meridian</title>
    <!-- Keep account creation centered and aligned with the app's neutral visual style. -->
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8f9fa;
            color: #202124;
        }
        .signup-card {
            width: min(90vw, 420px);
            background: white;
            border: 1px solid #dadce0;
            border-radius: 8px;
            box-shadow: none;
            padding: 32px 28px;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 2rem;
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #3c4043;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 1rem;
        }
        input:focus {
            border-color: #1a73e8;
            outline: 1px solid #1a73e8;
        }
        button {
            border: none;
            border-radius: 6px;
            padding: 12px 18px;
            background: #1a73e8;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .error {
            margin-bottom: 16px;
            padding: 10px 12px;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
        }
        .account-link {
            display: block;
            margin-top: 18px;
            color: #1967d2;
            text-align: center;
            text-decoration: none;
        }
        .account-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <!-- Registration card; server-side validation errors appear above the form. -->
    <main class="signup-card">
        <h1>Create your account</h1>

        {% if error %}
            <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post">
        <!-- The browser checks basic bounds; Flask performs authoritative validation. -->
            <div>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" minlength="3" maxlength="32" autocomplete="username" required>
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="6" maxlength="16" pattern="(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9_]{6,16}" title="Use 6–16 letters, numbers, or underscores, including at least one letter and one number." autocomplete="new-password" required>
            </div>

            <div>
                <label for="password_confirmation">Confirm password</label>
                <input type="password" id="password_confirmation" name="password_confirmation" minlength="6" maxlength="16" pattern="(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9_]{6,16}" title="Use 6–16 letters, numbers, or underscores, including at least one letter and one number." autocomplete="new-password" required>
            </div>

            <button type="submit">Create account</button>
        </form>

        <a class="account-link" href="{{ url_for('login', next=request.args.get('next', '')) }}">Already have an account? Log in</a>
    </main>
</body>
</html>

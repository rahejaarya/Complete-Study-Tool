<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - StudyTool</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7ff, #eef4ff);
            color: #1f2937;
        }
        .signup-card {
            width: min(90vw, 420px);
            background: white;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
            padding: 32px 28px;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 2rem;
            text-align: center;
        }
        .subtitle {
            margin: 0 0 24px;
            color: #4b5563;
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #374151;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
        }
        button {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            background: #4f46e5;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .error {
            margin-bottom: 16px;
            padding: 10px 12px;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
        }
        .account-link {
            display: block;
            margin-top: 18px;
            color: #4338ca;
            text-align: center;
            text-decoration: none;
        }
        .account-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <main class="signup-card">
        <h1>Create your account</h1>
        <p class="subtitle">Start planning your study sessions.</p>

        {% if error %}
            <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post">
            <div>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" minlength="3" maxlength="32" autocomplete="username" required>
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" required>
            </div>

            <div>
                <label for="password_confirmation">Confirm password</label>
                <input type="password" id="password_confirmation" name="password_confirmation" minlength="8" maxlength="128" autocomplete="new-password" required>
            </div>

            <button type="submit">Create account</button>
        </form>

        <a class="account-link" href="{{ url_for('login', next=request.args.get('next', '')) }}">Already have an account? Log in</a>
    </main>
</body>
</html>

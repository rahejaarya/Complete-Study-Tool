<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - StudyTool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}" defer></script>
    <script src="{{ url_for('static', filename='dashboard_notebooks.js') }}" defer></script>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-mark">✦</div>
                <span>StudyTool</span>
            </div>

            <nav class="navigation">
                <a href="{{ url_for('home') }}" class="nav-link">
                    <span class="nav-icon">▦</span>
                    Dashboard
                </a>
                <a href="{{ url_for('resources') }}" class="nav-link">
                    <span class="nav-icon">⌕</span>
                    Study Resources
                </a>
                <a href="{{ url_for('notes') }}" class="nav-link active">
                    <span class="nav-icon">✎</span>
                    Notes
                </a>
                <a href="{{ url_for('noise_songs') }}" class="nav-link">
                    <span class="nav-icon">♫</span>
                    Noise &amp; Songs
                </a>
                <a href="{{ url_for('time_management') }}" class="nav-link">
                    <span class="nav-icon">✓</span>
                    Time Management
                </a>
                <a href="{{ url_for('support') }}" class="nav-link">
                    <span class="nav-icon">♡</span>
                    Student Support
                </a>
                <a href="{{ url_for('ai_help') }}" class="nav-link">
                    <span class="nav-icon">✦</span>
                    Sammy
                </a>
            </nav>

            <div class="sidebar-bottom">
                <a href="{{ url_for('settings') }}" class="nav-link">
                    <span class="nav-icon">⚙</span>
                    Settings
                </a>
                <a href="{{ url_for('logout') }}" class="nav-link">
                    <span class="nav-icon">↩</span>
                    Logout
                </a>
            </div>
        </aside>

        <main class="main-content">
            <div class="notes-page">
                <div class="notes-page-shell">
                    <header class="notes-page-header">
                        <a href="{{ url_for('home') }}" class="back-link">← Go back to dashboard</a>
                        <h1>Your Notes Workspace</h1>
                    </header>

                    <section class="main-card notebook-card notes-page-card" id="notes-card" aria-labelledby="notebook-heading">
                        <div class="card-header">
                            <div>
                                <div class="eyebrow">YOUR WORKSPACE</div>
                                <h2 id="notebook-heading">Notebook &amp; Notes</h2>
                            </div>
                            <button
                                class="card-arrow notebook-toggle"
                                id="notebook-toggle"
                                type="button"
                                aria-expanded="false"
                                aria-controls="notebook-expanded"
                                aria-label="Open notebooks">↗</button>
                        </div>

                        <label class="notebook-quick-label" for="notebook-quick-note">
                            Quick note · typing opens your notebook
                        </label>
                        <textarea
                            class="notebook-textarea notebook-quick-note"
                            id="notebook-quick-note"
                            maxlength="20000"
                            placeholder="Jot down a quick note..."
                            aria-label="Quick note for the selected notebook"
                            disabled></textarea>
                        <p class="notebook-save-status" id="notebook-save-status" aria-live="polite">Loading notebooks…</p>

                        <div class="notebook-expanded" id="notebook-expanded" hidden>
                            <aside class="notebook-sidebar" aria-label="Your notebooks">
                                <div class="notebook-sidebar-heading">
                                    <h3>Notebooks</h3>
                                    <button class="notebook-add" id="notebook-add" type="button" disabled aria-label="Add notebook">+</button>
                                </div>
                                <div class="notebook-list" id="notebook-list" role="group" aria-label="Select a notebook"></div>
                            </aside>
                            <div class="notebook-editor">
                                <label class="notebook-name-label" for="notebook-name">Notebook name</label>
                                <input
                                    class="notebook-name"
                                    id="notebook-name"
                                    type="text"
                                    maxlength="80"
                                    autocomplete="off"
                                    disabled>
                                <label class="notebook-content-label" for="notebook-content">Notes</label>
                                <textarea
                                    class="notebook-textarea notebook-content"
                                    id="notebook-content"
                                    maxlength="200000"
                                    placeholder="Start writing in this notebook..."
                                    disabled></textarea>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

</body>
</html>

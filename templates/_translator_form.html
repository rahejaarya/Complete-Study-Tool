<article class="tool-card" id="translator-tool">
                                    <div class="tool-card-header">
                                        <div>
                                            <h3>Translator</h3>
                                            <p>Translate text between languages.</p>
                                        </div>
                                    </div>

                                    <form id="translator-form" class="translator-form">
                                        <div class="translator-panels">
                                            <div class="translator-panel">
                                                <label for="translator-source-language">From</label>
                                                <select id="translator-source-language">
                                                    <option value="auto">Detect language</option>
                                                    <option value="en">English</option>
                                                    <option value="es">Spanish</option>
                                                    <option value="fr">French</option>
                                                    <option value="de">German</option>
                                                    <option value="it">Italian</option>
                                                    <option value="pt">Portuguese</option>
                                                    <option value="zh">Chinese</option>
                                                    <option value="ja">Japanese</option>
                                                    <option value="ko">Korean</option>
                                                    <option value="ar">Arabic</option>
                                                    <option value="hi">Hindi</option>
                                                    <option value="ru">Russian</option>
                                                </select>

                                                <textarea id="translator-input" rows="7"
                                                        maxlength="5000"
                                                        placeholder="Enter text..."
                                                        aria-label="Text to translate"></textarea>

                                                <div class="translator-panel-footer">
                                                    <span id="translator-character-count">0 / 5000</span>
                                                    <button type="button" id="translator-clear"
                                                            class="tool-text-button">Clear</button>
                                                </div>
                                            </div>

                                            <div class="translator-panel">
                                                <label for="translator-target-language">To</label>
                                                <select id="translator-target-language">
                                                    <option value="en">English</option>
                                                    <option value="es" selected>Spanish</option>
                                                    <option value="fr">French</option>
                                                    <option value="de">German</option>
                                                    <option value="it">Italian</option>
                                                    <option value="pt">Portuguese</option>
                                                    <option value="zh">Chinese</option>
                                                    <option value="ja">Japanese</option>
                                                    <option value="ko">Korean</option>
                                                    <option value="ar">Arabic</option>
                                                    <option value="hi">Hindi</option>
                                                    <option value="ru">Russian</option>
                                                </select>

                                                <textarea id="translator-output" rows="7"
                                                        maxlength="5000"
                                                        placeholder="Translation appears here..."
                                                        aria-label="Translated text"
                                                        readonly></textarea>

                                                <div class="translator-panel-footer">
                                                    <span id="translator-status" role="status"
                                                        aria-live="polite"></span>
                                                    <button type="button" id="translator-copy"
                                                            class="tool-text-button">Copy</button>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="translator-bottom-row">
                                            <button type="button" id="translator-swap"
                                                    class="translator-swap"
                                                    aria-label="Swap source and target languages">
                                                <svg viewBox="0 0 24 24" aria-hidden="true"
                                                     focusable="false">
                                                    <path d="M7 7h13m0 0-4-4m4 4-4 4M17 17H4m0 0 4 4m-4-4 4-4"/>
                                                </svg>
                                                <span>Swap languages</span>
                                            </button>
                                            <span id="translator-error" class="translator-error"
                                                role="alert" hidden></span>
                                        </div>
                                    </form>
                                </article>

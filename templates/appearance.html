<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appearance - StudyTool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}" defer></script>
    <script src="{{ url_for('static', filename='appearance.js') }}" defer></script>
</head>
<body>
    <main class="appearance-page">
        <header class="appearance-header">
            <a class="appearance-back" href="{{ url_for('home') }}">← Back to dashboard</a>
            <div>
                <div class="eyebrow">MAKE IT YOURS</div>
                <h1>Appearance</h1>
                <p>Choose a light or dark mode, then pick a color to preview.</p>
            </div>
        </header>

        <p id="appearance-status" class="appearance-status" aria-live="polite">Select a theme to preview it, then apply your choice.</p>

        <section class="appearance-mode" aria-labelledby="light-themes-heading">
            <header class="appearance-mode-header">
                <div>
                    <h2 id="light-themes-heading">Light mode</h2>
                    <p>Bright backgrounds with soft color accents.</p>
                </div>
                <span aria-hidden="true">☀</span>
            </header>
            <div class="theme-card-grid">
                <button class="theme-card" type="button" data-theme-choice="light-lavender" aria-pressed="false">
                    <span class="theme-card-preview" data-theme="light-lavender" aria-hidden="true">
                        <span class="mini-dashboard-top"><i></i><i></i></span>
                        <span class="mini-dashboard-content">
                            <i class="mini-dashboard-sidebar"></i>
                            <i class="mini-dashboard-main">
                                <i class="mini-dashboard-banner"></i>
                                <i class="mini-dashboard-tiles"><i></i><i></i><i></i></i>
                                <i class="mini-dashboard-bottom"><i></i><i></i></i>
                            </i>
                        </span>
                    </span>
                    <span class="theme-card-name">Lavender</span>
                    <span class="theme-card-mode">Light</span>
                </button>
                <button class="theme-card" type="button" data-theme-choice="light-blue" aria-pressed="false">
                    <span class="theme-card-preview" data-theme="light-blue" aria-hidden="true">
                        <span class="mini-dashboard-top"><i></i><i></i></span>
                        <span class="mini-dashboard-content">
                            <i class="mini-dashboard-sidebar"></i>
                            <i class="mini-dashboard-main">
                                <i class="mini-dashboard-banner"></i>
                                <i class="mini-dashboard-tiles"><i></i><i></i><i></i></i>
                                <i class="mini-dashboard-bottom"><i></i><i></i></i>
                            </i>
                        </i>
                    </span>
                    <span class="theme-card-name">Light Blue</span>
                    <span class="theme-card-mode">Light</span>
                </button>
                <button class="theme-card" type="button" data-theme-choice="light-green" aria-pressed="false">
                    <span class="theme-card-preview" data-theme="light-green" aria-hidden="true">
                        <span class="mini-dashboard-top"><i></i><i></i></span>
                        <span class="mini-dashboard-content">
                            <i class="mini-dashboard-sidebar"></i>
                            <i class="mini-dashboard-main">
                                <i class="mini-dashboard-banner"></i>
                                <i class="mini-dashboard-tiles"><i></i><i></i><i></i></i>
                                <i class="mini-dashboard-bottom"><i></i><i></i></i>
                            </i>
                        </i>
                    </span>
                    <span class="theme-card-name">Light Green</span>
                    <span class="theme-card-mode">Light</span>
                </button>
                <button class="theme-card" type="button" data-theme-choice="light-sunset" aria-pressed="false">
                    <span class="theme-card-preview" data-theme="light-sunset" aria-hidden="true">
                        <span class="mini-dashboard-top"><i></i><i></i></span>
                        <span class="mini-dashboard-content">
                            <i class="mini-dashboard-sidebar"></i>
                            <i class="mini-dashboard-main">
                                <i class="mini-dashboard-banner"></i>
                                <i class="mini-dashboard-tiles"><i></i><i></i><i></i></i>
                                <i class="mini-dashboard-bottom"><i></i><i></i></i>
                            </i>
                        </i>
                    </span>
                    <span class="theme-card-name">Light Sunset</span>
                    <span class="theme-card-mode">Light</span>
                </button>
            </div>
        </section>

        <section class="appearance-mode" aria-labelledby="dark-themes-heading">
            <header class="appearance-mode-header">
                <div>
                    <h2 id="dark-themes-heading">Dark mode</h2>
                    <p>Dark backgrounds with coordinated color accents.</p>
                </div>
                <span aria-hidden="true">☾</span>
            </header>
            <div class="theme-card-grid">
                <button class="theme-card" type="button" data-theme-choice="dark-purple" aria-pressed="false">
                    <span class="theme-card-preview" data-theme="dark-purple" aria-hidden="true">
                        <span class="mini-dashboard-top"><i></i><i></i></span>
                        <span class="mini-dashboard-content">
                            <i class="mini-dashboard-sidebar"></i>
                            <i class="mini-dashboard-main">
                                <i class="mini-dashboard-banner"></i>
                                <i class="mini-dashboard-tiles"><i></i><i></i><i></i></i>
                                <i class="mini-dashboard-bottom"><i></i><i></i></i>
                            </i>
                        </i>
                    </span>
                    <span class="theme-card-name">Dark Purple</span>
                    <span class="theme-card-mode">Dark</span>
                </button>
                <button class="theme-card" type="button" data-theme-choice="dark-blue" aria-pressed="false">
                    <span class="theme-card-preview" data-theme="dark-blue" aria-hidden="true">
                        <span class="mini-dashboard-top"><i></i><i></i></span>
                        <span class="mini-dashboard-content">
                            <i class="mini-dashboard-sidebar"></i>
                            <i class="mini-dashboard-main">
                                <i class="mini-dashboard-banner"></i>
                                <i class="mini-dashboard-tiles"><i></i><i></i><i></i></i>
                                <i class="mini-dashboard-bottom"><i></i><i></i></i>
                            </i>
                        </i>
                    </span>
                    <span class="theme-card-name">Dark Blue</span>
                    <span class="theme-card-mode">Dark</span>
                </button>
                <button class="theme-card" type="button" data-theme-choice="dark-green" aria-pressed="false">
                    <span class="theme-card-preview" data-theme="dark-green" aria-hidden="true">
                        <span class="mini-dashboard-top"><i></i><i></i></span>
                        <span class="mini-dashboard-content">
                            <i class="mini-dashboard-sidebar"></i>
                            <i class="mini-dashboard-main">
                                <i class="mini-dashboard-banner"></i>
                                <i class="mini-dashboard-tiles"><i></i><i></i><i></i></i>
                                <i class="mini-dashboard-bottom"><i></i><i></i></i>
                            </i>
                        </i>
                    </span>
                    <span class="theme-card-name">Dark Green</span>
                    <span class="theme-card-mode">Dark</span>
                </button>
                <button class="theme-card" type="button" data-theme-choice="dark-sunset" aria-pressed="false">
                    <span class="theme-card-preview" data-theme="dark-sunset" aria-hidden="true">
                        <span class="mini-dashboard-top"><i></i><i></i></span>
                        <span class="mini-dashboard-content">
                            <i class="mini-dashboard-sidebar"></i>
                            <i class="mini-dashboard-main">
                                <i class="mini-dashboard-banner"></i>
                                <i class="mini-dashboard-tiles"><i></i><i></i><i></i></i>
                                <i class="mini-dashboard-bottom"><i></i><i></i></i>
                            </i>
                        </span>
                    </span>
                    <span class="theme-card-name">Dark Sunset</span>
                    <span class="theme-card-mode">Dark</span>
                </button>
            </div>
        </section>

        <div class="appearance-apply-row">
            <button id="apply-theme" class="timer-button timer-button-primary" type="button">Apply selected theme</button>
        </div>
    </main>
</body>
</html>
